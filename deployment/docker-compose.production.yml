version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: voiceshield-backend-prod
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - METRICS_ENABLED=true
      - STRUCTURED_LOGGING_ENABLED=true
      - STRICT_MODEL_INTEGRITY_CHECK=true
      - MAX_ACTIVE_SESSIONS=20
      - MAX_STREAM_CHUNK_BYTES=65536
      - MAX_STREAM_MESSAGE_BYTES=131072
      - STREAM_RATE_LIMIT_CHUNKS_PER_SEC=20
      - SESSION_IDLE_TTL_SEC=300
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - voiceshield-net

  nginx:
    image: nginx:1.25-alpine
    container_name: voiceshield-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - voiceshield-net

networks:
  voiceshield-net:
    driver: bridge
